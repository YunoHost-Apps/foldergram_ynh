#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "foldergram"
name = "Foldergram"
description.en = "Self-hosted folder-based Instagram-style photo and video gallery app"
description.fr = "Application de galerie photo et vidéo auto-hébergée, organisée par dossiers et inspirée d'Instagram"

version = "1.3.1~ynh1"

maintainers = ["DeMiro5001"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://foldergram.github.io/"
demo = "https://foldergram.intentdeep.com/"
admindoc = "https://foldergram.github.io/quick-start/"
code = "https://github.com/foldergram/foldergram"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/foldergram/foldergram/archive/refs/tags/v1.3.1.tar.gz"
    sha256 = "2a26791a3c9449feedb149a7c55afd7b5a42d2037d404b45900da1a797e6e2ea"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]
    allow_email = true
    
    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "ffmpeg"

    [resources.nodejs]
    version = "24"
